name: Morning Output demo
on: push

jobs:
  example_job:
    name: generate_output
    runs-on: ubuntu-latest

    steps:
      - name: step one
        id: step1
        run: echo "versionoir = 0.0.1" >> $GITHUB.OUTPUT
      - name: step two
        run: echo "This version is ${{ steps.step1.outputs.versionoir }}"


  
        
