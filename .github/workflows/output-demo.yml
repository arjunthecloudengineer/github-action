name: Morning Output demo
on: push

jobs:
  example_job1:
    runs-on: ubuntu-latest

    steps:
      - name: step one
        id: step1
        run: echo "versionoir=0.0.1" >> $GITHUB_OUTPUT
      - name: step two
        run: echo "This version is ${{ steps.step1.outputs.versionoir }}"
      - name: firstworld
        id: firstworld
        run: echo "firstworld=hello" >> $GITHUB_OUTPUT
      - name: secondworld
        id: secondworld
        run: echo "${{ steps.firstworld.outputs.firstworld }}"


  
        
